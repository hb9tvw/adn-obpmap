# adn-obpmap - add these lines INSIDE the <VirtualHost> of your ADN dashboard
# (the one that already proxies /ws to the ADN Monitor), then:
#   apache2ctl configtest && systemctl reload apache2

    Alias /obpmap /opt/obpmap
    <Directory /opt/obpmap>
        Require all granted
        DirectoryIndex index.html
        Options -Indexes
        <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE application/json application/javascript text/html text/css
        </IfModule>
    </Directory>
    # never serve these over the web
    <LocationMatch "^/obpmap/(recorder\.py|netfetch\.sh|netfetch\.list)$">
        Require all denied
    </LocationMatch>

# Optional, only on servers that should share their data with a "network" card elsewhere:
