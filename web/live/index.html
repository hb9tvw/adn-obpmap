<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADN {SRV} · ADN Live</title>
<link rel="icon" href="/img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08111f;--bg2:#0d1a2e;--line:#22344f;--line2:#2c4466;--txt:#e3edf8;--mut:#8aa3bf;--teal:#2dd4bf}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;background:linear-gradient(180deg,var(--bg2),var(--bg));color:var(--txt);font-family:"Plus Jakarta Sans",system-ui,sans-serif}
.top{flex:none;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 24px;background:rgba(9,18,33,.95);border-bottom:1px solid var(--line);z-index:10}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;color:var(--teal);text-decoration:none}
.brand img{height:34px;width:auto}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;align-items:center}
nav a{text-decoration:none;color:var(--mut);font-weight:600;font-size:14px;padding:7px 12px;border-radius:8px;border:1px solid transparent}
nav a:hover{color:var(--txt);background:rgba(255,255,255,.04)}
nav a.on{color:var(--teal);border-color:rgba(45,212,191,.45);background:rgba(45,212,191,.08)}
#tgbar{flex:none;display:none;align-items:center;gap:10px;padding:8px 24px;background:rgba(45,212,191,.1);border-bottom:1px solid rgba(45,212,191,.4);font-size:14px}
#tgbar b{color:var(--teal);font-size:16px}
#tgbar button{margin-left:auto;background:none;border:1px solid var(--line2);color:var(--txt);border-radius:7px;padding:2px 9px;cursor:pointer;font-size:15px}
#live{flex:1;width:100%;border:0;display:block;background:#0b1220}
.ext{font-size:12px;color:var(--mut);text-decoration:none;padding:7px 4px}
@media (max-width:700px){.top{padding:8px 10px;gap:6px}.brand{font-size:16px}.brand img{height:26px}nav{margin-left:0;width:100%;gap:4px}nav a{font-size:12.5px;padding:5px 8px}.ext{display:inline-block;font-size:12px}#tgbar{padding:7px 10px;font-size:13px}}
</style>
<link rel="manifest" href="/obpmap/manifest.webmanifest">
<meta name="theme-color" content="#08111f">
<link rel="apple-touch-icon" href="/obpmap/icon-192.png">
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/obpmap/sw.js', {scope: '/obpmap/'}).catch(function(){});</script>
<style id="mobile-nav-fix">
@media (max-width:700px){
  html,body{overflow-x:hidden;max-width:100%}
  .top{flex-wrap:wrap!important;row-gap:6px!important;padding:8px 10px!important}
  .brand{white-space:normal!important;font-size:16px!important;min-width:0}
  .brand img{height:22px!important}
  .top nav{flex:1 0 100%!important;width:100%!important;max-width:100%!important;margin-left:0!important;display:flex!important;flex-wrap:wrap!important;align-items:center;gap:4px 2px!important}
  .top nav a{font-size:13px!important;padding:5px 6px!important;white-space:nowrap;flex:none}
  .top nav a.on{display:none!important}
  html body header.top nav select#langsel{width:82px!important;max-width:82px!important;min-width:0!important;font-size:12px!important;padding:4px 2px!important;margin-left:auto!important;box-sizing:border-box!important}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/img/logo.png" alt="ADN">Systems {SRV}</a>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/obpmap/">OpenBridge Map</a>
    <a href="/obpmap/live/" class="on">🎧 ADN Live</a>
    <a class="ext" href="https://listen.adn.systems/" id="liveext" target="_blank" rel="noopener" title="Open ADN Live in a new tab">↗ App</a>
  </nav>
</header>
<div id="tgbar"><span>🎧 TG <b id="tgn"></b> copied – paste it in <b>“Escuchar un TG ahora”</b></span><button aria-label="close" onclick="this.parentNode.style.display='none'">×</button></div>
<iframe id="live" src="about:blank" title="ADN Live" allow="autoplay; clipboard-read; clipboard-write; fullscreen"></iframe>
<script src="/obpmap/config.js?v=1"></script>
<script src="/obpmap/common.js?v=1"></script>
<script>
(function () {
  var url = (window.OBPMAP_CONFIG || {}).adnLiveUrl || 'https://listen.adn.systems/';
  document.getElementById('live').src = url; document.getElementById('liveext').href = url;
  var tg = (new URLSearchParams(location.search).get('tg') || '').replace(/[^0-9]/g, '');
  if (tg) { document.getElementById('tgn').textContent = tg; document.getElementById('tgbar').style.display = 'flex'; }
})();
</script>
<script src="/obpmap/i18n.js?v=1"></script>
</body>
</html>
